<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Chidera Ojimba — Cloud Engineer">
  <defs>
    <!-- Bright background: electric indigo to sky to cyan -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="192" height="192" rx="44" fill="url(#bg)"/>

  <!-- Soft highlight -->
  <ellipse cx="70" cy="34" rx="90" ry="40" fill="#ffffff" fill-opacity="0.14"/>

  <!-- Cloud mark -->
  <path
    d="M64 88 C64 76, 73 68, 84 68
       C87 60, 95 54, 105 54
       C117 54, 127 63, 128 74
       C136 75, 142 82, 142 90
       C142 99, 135 106, 126 106
       L76 106
       C69 106, 64 98, 64 88 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />

  <!-- "CO" monogram -->
  <text
    x="100"
    y="165"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="62"
    font-weight="800"
    letter-spacing="4"
    fill="#ffffff"
    filter="url(#shadow)"
  >CO</text>
</svg>
